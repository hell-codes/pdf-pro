<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — PDF Pro</title>
<meta name="description" content="Log in to your PDF Pro account to work with larger files and manage your workspace.">
<meta name="theme-color" content="#F8FAFC">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/upload.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/states.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="login">

<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      </span>
      PDF Pro
    </a>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <a href="all-tools.html" class="btn btn-secondary btn-sm">All Tools</a>
      <button class="nav-burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-menu">
  <a href="index.html">Home</a>
  <a href="all-tools.html">All Tools</a>
</div>

<main class="auth-page">
  <div class="blob-field">
    <div class="blob hero-blob-1"></div>
    <div class="blob hero-blob-2"></div>
    <div class="blob hero-blob-3"></div>
  </div>

  <div class="auth-card glass-strong">
    <div class="auth-modal-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
      </span>
    </div>
    <h1 class="auth-modal-title">Welcome back</h1>
    <p class="auth-modal-subtitle">Log in to continue working with your PDFs.</p>

    <div class="auth-error" data-auth-notice hidden></div>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="auth-field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="button" class="auth-forgot" data-auth-forgot>Forgot password?</button>

      <div class="auth-error" data-auth-error hidden></div>

      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
    </form>

    <p class="auth-switch">New to PDF Pro? <a href="signup.html">Create a free account</a></p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/animations.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
